name: CI

# Runs the two test suites (backend/pytest, frontend/jest) plus type checking
# and a production build on every push and pull request, so a broken commit
# gets caught here instead of on main. Nothing here deploys anything — see
# docs/DEPLOY.md and render.yaml for that.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend (jest, build + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --ci

      - name: Production build (also type-checks and lints)
        # `next build` already runs the full type check + ESLint pass, so a
        # separate `tsc --noEmit` step is redundant here — and on a clean
        # checkout it would fail anyway: next-env.d.ts references
        # .next/types/routes.d.ts, which only exists after a build has run
        # once. AUTH_TYPE=NO_AUTH matches local dev (.env.local); without it
        # the auth pages this build prerenders fail on OAuth env vars for
        # providers this deployment doesn't use.
        env:
          AUTH_TYPE: NO_AUTH
          NEXTAUTH_SECRET: ci-build-only-not-a-real-secret
        run: npm run build
