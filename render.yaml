services:
  - type: web
    name: alertlens-backend
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # /health, not /pipeline: every other route requires the API key, and a
    # health check that has to authenticate is a health check that fails for
    # the wrong reasons.
    healthCheckPath: /health
    autoDeploy: true
    # Render attaches persistent disks only to paid instances. On the free plan
    # the filesystem is wiped whenever the service sleeps, so the engine's event
    # log is lost; ALERTLENS_AUTOSEED_GOLDEN below re-creates the demo run on
    # every cold start so visitors never land on an empty engine.
    disk:
      name: alertlens-data
      mountPath: /opt/render/project/src/backend
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Generated once by Render, then copied into the frontend's
      # ALERTLENS_API_KEY. Without it this service is reachable but refuses
      # every non-local request, which is the intended fail-closed default.
      - key: ALERTLENS_API_KEY
        generateValue: true
      # Re-run the deterministic golden scenario on startup when there is no
      # event log to restore (see the disk note above). Pages nobody.
      - key: ALERTLENS_AUTOSEED_GOLDEN
        value: "1"
